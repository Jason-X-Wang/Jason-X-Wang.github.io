bio: |
  Dr. Jason X. Wang is a Lecturer/Assistant Professor of Sustainable Supply Chain Management at Sheffield University Management School. Previously, he worked at the University of Huddersfield as MBA Programme Leader and Senior Lecturer in Operations and Supply Chain Management.

  Focusing on sustainable/circular supply chain management applied with carbon neutrality and blockchain, Jason's work has been published in leading international journals, including the *International Journal of Operations & Production Management*, *Transportation Research Part E: Logistics and Transportation Review*, *Journal of Business Research*, *International Journal of Production Economics*, and *Business Strategy and the Environment*.

  Jason serves on the Editorial Review Boards of the *Journal of Supply Chain Management*, *International Journal of Operations & Production Management*, and *IEEE Transactions on Engineering Management*, is an Editorial Board Member of *Operations Management* (MDPI), Guest Editor of *Transportation Research Part E: Logistics and Transportation Review*, and Department Editor (Operations Research, Information & Technology) for *Cogent Business & Management*.

  His work has attracted strong attention from the industrial community, providing consultation to vehicle recovery service supply chains in New Zealand and the electric motorsport industry in the UK.

